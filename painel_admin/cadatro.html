<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel do Administrador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/inicio.css" rel="stylesheet">

</head>
<body>

<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-md-3 sidebar p-3">
            <h5 class="mb-4 text-center">Painel Admin</h5>

            <div class="list-group list-group-flush">
                <a href="cadatro.html" class="list-group-item list-group-item-action">
                    Cadastro
                </a>
                <a href="#" class="list-group-item list-group-item-action">
                    Eleitores
                </a>
                <a href="#" class="list-group-item list-group-item-action">
                    Cargos
                </a>
                <a href="#" class="list-group-item list-group-item-action">
                    Dashboard de Resultados
                </a>
            </div>
        </div>

        <!-- CONTEÚDO PRINCIPAL -->
        <div class="col-md-9 p-5">
            <h3>Cadastro</h3>
            
        <main class="col-md-9 ms-sm-auto col-lg-10 p-5" style="align-items: center;">
                <div class="col-md-6">
                    <div class="form-box">

                        <form action="#" method="post" id="formCadastro">
                            
                            <div class="mb-3">
                                <label class="form-label">Nome Completo *</label>
                                <input type="text" class="form-control" name="categoria" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Categoria *</label>
                                <select class="form-select" required>
                                    <option value="">Selecione</option>
                                    <option>Eleitor</option>
                                    <option>Presidente</option>
                                    <option>Vice-Presidente</option>
                                    <option>Conselheiro(a)</option>
                                    <option>Tesoureiro(a)</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Email *</label>
                                <input type="email" class="form-control" name="email" required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Senha *</label>
                                <input type="password" class="form-control" name="senha" required>
                            </div>

                            <div class="d-grid">
                                <button class="btn btn-secondary">
                                    Cadastrar
                                </button>
                            </div>

                        </form>

                    </div>
                </div>
            </div>

        </main>


        </div>

    </div>
</div>

</body>
</html>
